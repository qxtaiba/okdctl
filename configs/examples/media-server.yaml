# Media Server Stack Configuration
# =================================
# This configuration creates a cluster optimized for running
# the media server stack (Plex, *arr apps, etc.)
---
cluster:
  name: grappleberry
  domain: k8s.local
distribution:
  type: okd
  version: "4.18.0-okd-scos.10"
provider:
  type: proxmox
  proxmox:
    host: 192.168.227.195
    node: pve
    storage: local-lvm
    iso_storage: local
    bridge: vmbr0
topology:
  control_plane:
    count: 3
    cpu: 4
    memory: 16384 # 16 GB
    disk: 100 # 100 GB
  workers:
    count: 3
    cpu: 8
    memory: 32768 # 32 GB
    disk: 200 # 200 GB
networking:
  machine_cidr: 192.168.227.0/24
  pod_cidr: 10.128.0.0/14
  service_cidr: 172.30.0.0/16
  gateway: 192.168.227.1
  dns:
    - 192.168.227.1
addons:
  flux:
    enabled: true
    settings:
      provider: flux
      branch: main
      path: kubernetes/clusters/production
