---
schemaVersion: "v2"
---
cluster:
  name: production
  domain: k8s.local
distribution:
  type: okd
  version: "4.22.0-okd-scos.7"
provider:
  type: proxmox
  proxmox:
    host: 192.168.1.100
    node: pve
    storage: local-lvm
    iso_storage: local
    bridge: vmbr0
topology:
  control_plane:
    count: 3 # HA control plane
    cpu: 8
    memory_mb: 32768 # 32 GB
    disk_gb: 200
  workers:
    count: 5
    cpu: 16
    memory_mb: 65536 # 64 GB
    disk_gb: 500
networking:
  machine_cidr: 192.168.1.0/24
  pod_cidr: 10.128.0.0/14
  service_cidr: 172.30.0.0/16
  gateway: 192.168.1.1
  dns:
    - 192.168.1.1
    - 8.8.8.8
  static_ip:
    # start IS the bootstrap node's IP; remaining nodes get start+1,
    # start+2, ... and the API VIP derives from it (x.y.z.10) unless
    # bastion.vip is set. Keep it clear of live hosts (Proxmox host,
    # ignition server). Netmask is derived from machine_cidr.
    start: 192.168.1.140
    interface: ens18
addons:
  flux:
    enabled: true
    settings:
      provider: flux
      branch: main
      path: kubernetes/clusters/production
