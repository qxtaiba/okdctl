schemaVersion: "v1"
# Production-Ready Cluster Configuration
# ======================================
# This configuration creates a highly available production cluster
# with all features enabled.
---
cluster:
  name: production
  domain: k8s.local
distribution:
  type: okd
  version: "4.18.0-okd-scos.10"
provider:
  type: proxmox
  proxmox:
    host: 192.168.1.100
    node: pve
    storage: local-lvm
    iso_storage: local
    bridge: vmbr0
topology:
  control_plane:
    count: 3 # HA control plane
    cpu: 8
    memory: 32768 # 32 GB
    disk: 200 # 200 GB
  workers:
    count: 5
    cpu: 16
    memory: 65536 # 64 GB
    disk: 500 # 500 GB
networking:
  machine_cidr: 192.168.1.0/24
  pod_cidr: 10.128.0.0/14
  service_cidr: 172.30.0.0/16
  gateway: 192.168.1.1
  dns:
    - 192.168.1.1
    - 8.8.8.8
addons:
  flux:
    enabled: true
    settings:
      provider: flux
      branch: main
      path: kubernetes/clusters/production
