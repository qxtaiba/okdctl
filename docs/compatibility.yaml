# Compatibility matrix source of truth.
#
# This file drives the "Compatibility" section of README.md. Edit entries
# here when you test a new version combination, then run:
#
#     make compat
#
# which re-renders the section between the <!-- COMPAT:START --> and
# <!-- COMPAT:END --> markers in README.md. CI will fail if the rendered
# output drifts from this file, ensuring the README stays in sync.
#
# Guidelines:
#   - "tested" means you successfully ran `openshitctl deploy` end-to-end
#     against this version and verified the cluster reached Ready state
#   - "known_broken" means a specific version or range that has been
#     observed to fail; add a one-line reason
#   - keep the list short and honest — this is a signal of what you
#     actually support, not an aspirational list

components:
  - name: Proxmox VE
    tested:
      - "8.0"
      - "8.1"
      - "8.2"
    known_broken:
      - version: "<8.0"
        reason: "API breaking changes in the pve-api-go client"

  - name: OKD
    tested:
      - "4.15.0"
      - "4.16.0"
    known_broken:
      - version: "<4.13"
        reason: "ignition format v3 changes not handled"

  - name: Host OS
    tested:
      - "Debian 12"
      - "Fedora 39"
    known_broken: []

  - name: Storage backend
    tested:
      - "LVM-thin"
      - "directory"
    known_broken:
      - version: "Ceph"
        reason: "not tested; PRs welcome"

  - name: Firewall
    tested:
      - "firewalld"
      - "ufw"
    known_broken:
      - version: "nftables (direct)"
        reason: "not tested; firewalld and ufw both use nftables under the hood"

  - name: Host architecture
    tested:
      - "amd64"
      - "arm64"
    known_broken:
      - version: "Windows"
        reason: "not supported by design — this is a Linux/macOS tool"
