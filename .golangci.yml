---
version: "2"
formatters:
  enable:
    - gofumpt
    - goimports
linters:
  default: none
  enable:
    # correctness
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errorlint
    # antipatterns
    - gocritic
    - revive
    - unconvert
    - unparam
    - wastedassign
    - nilerr
    - noctx
    # security
    - gosec
    # style
    - misspell
    - dupword
    - goconst
    - nakedret
    - whitespace
    - nolintlint
    # complexity
    - gocyclo
    - funlen
    - nestif
    # duplication
    - dupl
  settings:
    gocyclo:
      min-complexity: 30
    funlen:
      lines: 120
      statements: 65
    nestif:
      min-complexity: 12
    dupl:
      threshold: 100
    goconst:
      min-occurrences: 3
      min-len: 3
      # ignore-calls:true (default) is intentional: oc/helm argv literals
      # ("-n", "get", "json", "haproxy", "flux-system", "infrastructure")
      # recur 13-26x each as call args that should not become constants;
      # enabling false needs min-occurrences>=30 plus exclusions to stay green.
      ignore-calls: true
      # test fixtures repeat prod strings; without this they push prod
      # occurrence counts over the threshold and demand prod constants
      ignore-tests: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: exported
        - name: increment-decrement
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: unreachable-code
        - name: unused-parameter
        - name: var-naming
    gosec:
      excludes:
        - G107 # url provided by variable — expected for api calls
        - G304 # file path from variable — expected for config loading
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
      - legacy
    rules:
      # table-driven tests legitimately repeat shape and run long
      - linters: [dupl, funlen]
        path: _test\.go
      # G306: test helpers write fake executables (0755) and conf fixtures
      # G101: fixtures embed obviously-fake tokens to exercise redaction
      - linters: [gosec]
        path: _test\.go
        text: "^G(101|306):"
      # noctx: allow http calls without context in wizard discovery (short-lived)
      - linters: [noctx]
        path: proxmox_discovery\.go
    paths:
      - docs
      - third_party
run:
  tests: true
