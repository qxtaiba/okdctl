---
pre-commit:
  parallel: true
  commands:
    gofumpt:
      glob: "*.go"
      # Pinned to the gofumpt embedded in golangci-lint v2.12.2 (CI's
      # formatter check) so hook and CI can't dispute formatting; bump in
      # lockstep with the golangci-lint pin, hence no renovate annotation.
      run: go run mvdan.cc/gofumpt@v0.9.2 -l -w {staged_files}
      stage_fixed: true
    govet:
      run: go vet ./...
    sops-guard:
      glob: "automation/config/secrets/*"
      # docs/addons/secretstore.md routes real plaintext tokens into this
      # dir; only sops-encrypted payloads may ever be committed from it.
      run: |
        status=0
        for f in {staged_files}; do
          case "$f" in */.gitkeep) continue ;; esac
          if ! grep -q 'ENC\[AES256_GCM' "$f"; then
            echo "refusing to commit $f: not sops-encrypted (see docs/addons/secretstore.md)" >&2
            status=1
          fi
        done
        exit $status
    shellcheck:
      glob: "*.sh"
      run: |
        if command -v shellcheck >/dev/null 2>&1; then
          shellcheck {staged_files}
        else
          echo "shellcheck not installed; skipping shell lint" >&2
        fi
pre-push:
  parallel: true
  commands:
    build:
      run: go build ./...
    test:
      run: go test ./...
    docs-check:
      run: make docs-check
