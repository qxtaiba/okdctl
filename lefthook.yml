---
pre-commit:
  parallel: true
  commands:
    gofumpt:
      glob: "*.go"
      run: gofumpt -l -w {staged_files}
      stage_fixed: true
    govet:
      run: go vet ./...
    shellcheck:
      glob: "*.sh"
      run: |
        if command -v shellcheck >/dev/null 2>&1; then
          shellcheck {staged_files}
        else
          echo "shellcheck not installed; skipping shell lint" >&2
        fi
pre-push:
  parallel: true
  commands:
    build:
      run: go build ./...
    test:
      run: go test ./...
