---
version: 2

project_name: okdctl

before:
  hooks:
    - go mod tidy

builds:
  - id: okdctl
    main: ./cmd/okdctl
    binary: okdctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/qxtaiba/okdctl/pkg/version.Version={{.Version}}
      - -X github.com/qxtaiba/okdctl/pkg/version.GitCommit={{.ShortCommit}}
      - -X github.com/qxtaiba/okdctl/pkg/version.BuildDate={{.Date}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: darwin
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - NOTICE
      - CHANGELOG.md

checksum:
  name_template: "SHA256SUMS"
  algorithm: sha256

# SBOM attached to every release; syft produces CycloneDX JSON
sboms:
  - id: default
    artifacts: archive
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.sbom.json"
    cmd: syft
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

# Sigstore keyless signing of checksum file + artifacts.
# Signs via cosign using a GitHub OIDC identity token — no private keys.
signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# Homebrew tap — goreleaser will open a PR against
# github.com/qxtaiba/homebrew-tap on every release, updating the formula.
#
# skip_upload is set to "true" until the qxtaiba/homebrew-tap repository
# exists. Without that, goreleaser fails the entire release trying to
# clone a non-existent repo. Once the tap repo is created (empty repo
# with a Formula/ directory is enough), flip this to "auto" or remove
# the line entirely.
brews:
  - name: okdctl
    skip_upload: "true"
    repository:
      owner: qxtaiba
      name: homebrew-tap
      branch: main
    directory: Formula
    homepage: "https://github.com/qxtaiba/okdctl"
    description: "Deploy OKD clusters on Proxmox with one binary"
    license: "Apache-2.0"
    test: |
      system "#{bin}/okdctl version"
    install: |
      bin.install "okdctl"

# .deb / .rpm packages for Linux users who install via apt/dnf
nfpms:
  - id: default
    package_name: okdctl
    vendor: Q Al Nuaimi
    homepage: "https://github.com/qxtaiba/okdctl"
    maintainer: "Q Al Nuaimi"
    description: |-
      Deploy production-ready OKD Kubernetes clusters on Proxmox VE.
      Interactive TUI wizard, single binary, opinionated defaults for homelab
      operators.
    license: "Apache-2.0"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/okdctl/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/okdctl/NOTICE
      - src: README.md
        dst: /usr/share/doc/okdctl/README.md

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: qxtaiba
    name: okdctl
  prerelease: auto
  draft: false
  header: |
    ## okdctl {{ .Tag }}

    See [CHANGELOG.md](https://github.com/qxtaiba/okdctl/blob/main/CHANGELOG.md)
    for human-curated release notes.

    All release artifacts are signed with sigstore keyless signing. Verify
    with `cosign verify-blob` (see README for instructions).
  footer: |
    **Full Changelog**: https://github.com/qxtaiba/okdctl/compare/{{ .PreviousTag }}...{{ .Tag }}
