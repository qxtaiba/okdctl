---
# tfsec configuration — fail-closed by default.
#
# Policy: tfsec is a gating CI check (soft_fail is NOT set in ci.yml).
# Any finding that would block CI must be either fixed or explicitly
# suppressed here with a documented rationale.
#
# To add an exclusion:
#   exclude:
#     - code: AVD-XXX-0000
#       reason: "<one sentence why this is acceptable for okdctl>"
#
# Leave this block absent (not empty) until the first real CI failure
# identifies which rule codes fire — then add them here.
