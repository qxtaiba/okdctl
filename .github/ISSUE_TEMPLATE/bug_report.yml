name: Bug report
description: Report a bug in openshitctl
title: "[bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please run
        `openshitctl doctor` and paste its output in the "doctor output"
        field below, along with any relevant error output from the
        command that was failing. The more context, the faster the fix.

  - type: input
    id: version
    attributes:
      label: openshitctl version
      description: Output of `openshitctl version`
      placeholder: "openshitctl v0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Host OS
      description: What OS are you running openshitctl from?
      options:
        - Debian 12
        - Debian 11
        - Ubuntu 22.04
        - Ubuntu 24.04
        - Fedora 39
        - Fedora 40
        - Rocky Linux 9
        - AlmaLinux 9
        - macOS
        - Other (please specify in "Additional context")
    validations:
      required: true

  - type: input
    id: proxmox
    attributes:
      label: Proxmox VE version
      placeholder: "8.2.4"
    validations:
      required: true

  - type: input
    id: okd
    attributes:
      label: OKD version
      description: From your config or `openshitctl.yaml`
      placeholder: "4.15.0"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include exact error messages.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce. If you can't reproduce, say so.
      placeholder: |
        1. Run `openshitctl deploy`
        2. Answer wizard with ...
        3. Error appears at step X
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: |
        Paste the full output of `openshitctl doctor`. This captures
        host OS, available binaries, port status, pull-secret validity,
        and disk space — the environment data most bugs depend on.
      render: shell
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — custom network config, odd storage, other tools running, etc.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I ran `openshitctl doctor` and it did not flag the issue
          required: true
        - label: I searched existing issues before filing
          required: true
