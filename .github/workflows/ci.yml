---
name: ci
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  # Go
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
  vet-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
  build-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o bin/okdctl ./cmd/okdctl
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
      - run: chmod +x .github/scripts/coverage-check.sh
      - run: .github/scripts/coverage-check.sh coverage.out
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install govulncheck
        env:
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: v1.6.0
        run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
      - run: govulncheck ./...
  docs-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run -tags docs ./cmd/okdctl-gen-docs
      - name: fail on CLI reference drift
        run: |
          if ! git diff --quiet docs/cli/ || \
             [ -n "$(git ls-files --others --exclude-standard docs/cli/)" ]; then
            echo "CLI reference is out of date. Run 'make docs' and commit docs/cli/." >&2
            git status docs/cli/ >&2
            exit 1
          fi
  # YAML
  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install yamlfmt
        env:
          # renovate: datasource=go depName=github.com/google/yamlfmt
          YAMLFMT_VERSION: v0.21.0
        run: go install github.com/google/yamlfmt/cmd/yamlfmt@${YAMLFMT_VERSION}
      - run: yamlfmt -lint .
  # Infrastructure
  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.3"
      - run: terraform fmt -check -recursive infrastructure/terraform
      - working-directory: infrastructure/terraform/modules/proxmox-okd
        run: terraform init -backend=false && terraform validate
      - working-directory: infrastructure/terraform/environments/production
        run: terraform init -backend=false && terraform validate
  lint-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: "v0.62.0"
      - working-directory: infrastructure/terraform/modules/proxmox-okd
        run: |
          tflint --init --config="${GITHUB_WORKSPACE}/infrastructure/terraform/.tflint.hcl"
          tflint -f compact --config="${GITHUB_WORKSPACE}/infrastructure/terraform/.tflint.hcl"
      - working-directory: infrastructure/terraform/environments/production
        run: |
          tflint --init --config="${GITHUB_WORKSPACE}/infrastructure/terraform/.tflint.hcl"
          tflint -f compact --config="${GITHUB_WORKSPACE}/infrastructure/terraform/.tflint.hcl"
  scan-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: infrastructure/terraform
  # Shell
  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
