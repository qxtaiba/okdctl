---
name: codeql
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    # Weekly full scan, Mondays at 07:00 UTC.
    - cron: "0 7 * * 1"
permissions:
  contents: read
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Non-blocking until Code Scanning is enabled on this repo. Private
    # repos need GHAS (or must be made public) before SARIF uploads work;
    # the workflow currently fails at analyze-upload with "Code scanning
    # is not enabled for this repository." Keeping it here as scaffolding
    # so flipping the switch requires no YAML change.
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["go"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          languages: ${{ matrix.language }}
          # Extended query pack for deeper SAST coverage (default is "basic").
          queries: security-and-quality
      - uses: github/codeql-action/analyze@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          category: "/language:${{ matrix.language }}"
