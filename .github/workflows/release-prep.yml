---
# Dry-run goreleaser on every PR that touches the release pipeline. This
# catches config errors (bad template vars, broken nfpms section, etc.)
# before a tag push would eat them. Pattern adopted from cli/cli (gh).
name: release-prep
on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - .github/workflows/release-prep.yml
      # install.sh reconstructs the archive name by hand from
      # archives.name_template — dry-run the snapshot when it changes.
      - scripts/install.sh
# Cancel redundant runs when a PR is force-pushed or amended.
concurrency:
  group: release-prep-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: "v2.17.0"
          # snapshot: build without publishing or signing, verifying the
          # config still produces a valid release graph.
          args: release --snapshot --clean --skip=publish,sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Assert dist/ contains the exact archive-name shape install.sh
      # reconstructs (okdctl_<version>_linux_<arch>.tar.gz), converting the
      # comment-enforced coupling into a gate.
      - name: assert archive names match install.sh
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            match=$(find dist -maxdepth 1 -name "okdctl_*_linux_${arch}.tar.gz" | head -1)
            if [ -z "$match" ]; then
              echo "no okdctl_*_linux_${arch}.tar.gz in dist/ — install.sh reconstructs this name from archives.name_template" >&2
              exit 1
            fi
          done
