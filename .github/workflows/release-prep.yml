---
# Dry-run goreleaser on every PR that touches the release pipeline. This
# catches config errors (bad template vars, broken nfpms section, etc.)
# before a tag push would eat them. Pattern adopted from cli/cli (gh).
name: release-prep
on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - .github/workflows/release-prep.yml
# Cancel redundant runs when a PR is force-pushed or amended.
concurrency:
  group: release-prep-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@61119d458adab75f756bc0b9e4bde25725f86a7a # v0.17.2
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "v2.15.2"
          # snapshot: build without publishing or signing, verifying the
          # config still produces a valid release graph.
          args: release --snapshot --clean --skip=publish,sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
