---
# Refreshes streamPins in internal/distribution/okd/provision/coreos.go from
# upstream openshift/installer release-4.X branch tips. Opens a PR when any
# pin drifts. Runs weekly so a forgotten manual bump never blocks the next
# okdctl release.
name: update-coreos-pins
on:
  schedule:
    - cron: '0 13 * * 1' # Monday 13:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refresh coreos pins
        run: scripts/update-coreos-pins.sh
      - name: Open PR if pins drifted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          if git diff --quiet -- internal/distribution/okd/provision/coreos.go; then
            echo "no pin drift; nothing to open"
            exit 0
          fi
          BRANCH="bot/coreos-pins-$(date -u +%Y%m%d)"
          git config user.name "okdctl-bot"
          git config user.email "okdctl-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add internal/distribution/okd/provision/coreos.go
          git commit -m "chore(deps): update coreos stream pins"
          git push origin "$BRANCH"
          gh pr create --base develop --head "$BRANCH" \
            --title "chore(deps): update coreos stream pins" \
            --body "Auto-generated by .github/workflows/update-coreos-pins.yml. Refreshes the streamPins map in internal/distribution/okd/provision/coreos.go from openshift/installer's release-4.X branch tips. Review the diff and merge if the new pins are acceptable."
