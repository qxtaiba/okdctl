---
name: release
on:
  push:
    tags:
      - v*
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: install syft
        env:
          # renovate: datasource=github-releases depName=anchore/syft
          SYFT_VERSION: v1.57.2
        # anchore/sbom-action resolves the version through the GitHub releases
        # web page, which times out for anchore/syft (anchore/sbom-action#667);
        # the release download path is served by the CDN and does not.
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          base="https://github.com/anchore/syft/releases/download/${SYFT_VERSION}"
          file="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "$file" "${base}/${file}"
          curl -fsSL --retry 5 --retry-all-errors -o checksums.txt "${base}/syft_${SYFT_VERSION#v}_checksums.txt"
          grep " ${file}$" checksums.txt | sha256sum -c -
          tar -xzf "$file" syft
          sudo install -m 0755 syft /usr/local/bin/syft
          syft version
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        id: goreleaser
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: "v2.20.3"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/okdctl_*.tar.gz
            dist/okdctl_*.deb
            dist/*.rpm
            dist/SHA256SUMS
      # Compute base64-encoded subject hashes for SLSA provenance from
      # goreleaser's artifacts.json. Pattern adapted from anchore/syft and
      # goreleaser/goreleaser's own release workflows.
      - name: compute artifact hashes
        id: hash
        env:
          ARTIFACTS: "${{ steps.goreleaser.outputs.artifacts }}"
        run: |
          set -euo pipefail
          checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select(.type=="Checksum") | .path')
          if [ -z "$checksum_file" ] || [ ! -f "$checksum_file" ]; then
            echo "no checksum artifact found in goreleaser output" >&2
            exit 1
          fi
          hashes=$(base64 -w0 < "$checksum_file")
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"
  # Generate SLSA build provenance for the release binaries. This runs in
  # a separate, isolated job that cannot see the release workflow's
  # environment — a SLSA requirement for non-forgeable provenance.
  provenance:
    needs: release
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      # Pin the asset name so it matches the README-documented provenance file;
      # the generator's default (multiple.intoto.jsonl) would drift from it.
      provenance-name: okdctl.intoto.jsonl
      upload-assets: true
