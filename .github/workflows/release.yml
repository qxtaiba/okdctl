---
name: release
on:
  push:
    tags:
      - v*
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        id: goreleaser
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: "v2.18.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/okdctl_*.tar.gz
            dist/okdctl_*.deb
            dist/*.rpm
            dist/SHA256SUMS
      # Compute base64-encoded subject hashes for SLSA provenance from
      # goreleaser's artifacts.json. Pattern adapted from anchore/syft and
      # goreleaser/goreleaser's own release workflows.
      - name: compute artifact hashes
        id: hash
        env:
          ARTIFACTS: "${{ steps.goreleaser.outputs.artifacts }}"
        run: |
          set -euo pipefail
          checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select(.type=="Checksum") | .path')
          if [ -z "$checksum_file" ] || [ ! -f "$checksum_file" ]; then
            echo "no checksum artifact found in goreleaser output" >&2
            exit 1
          fi
          hashes=$(base64 -w0 < "$checksum_file")
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"
  # Generate SLSA build provenance for the release binaries. This runs in
  # a separate, isolated job that cannot see the release workflow's
  # environment — a SLSA requirement for non-forgeable provenance.
  provenance:
    needs: release
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      # Pin the asset name so it matches the README-documented provenance file;
      # the generator's default (multiple.intoto.jsonl) would drift from it.
      provenance-name: okdctl.intoto.jsonl
      upload-assets: true
