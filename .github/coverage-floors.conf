# Per-package statement-coverage floors (percentage, integer or decimal).
# Key is the full import path (e.g. github.com/qxtaiba/okdctl/internal/netutil).
# Key "*"   sets the default floor for any package present in the profile
#           but not listed explicitly.
# Key "total" gates aggregate statement coverage across the whole profile.
#
# Coverage is covered/total statements per package, computed by
# .github/scripts/coverage-check.sh from the raw coverage.out profile.
# A package listed here but absent from the profile FAILS the gate: that
# catches a package deleted, renamed, or refactored down to zero statements.
# Deleting a package's tests is caught by the floor itself, not by that check.
#
# These are regression tripwires, not targets. Coverage percentage does not
# measure test quality (Inozemtseva & Holmes, ICSE 2014), so a floor exists
# only to make a silent drop loud — never to be chased upward. Do not raise a
# floor to match new coverage; run `make coverage-floors` at a re-baseline.
#
# Re-baselined 2026-09-25 as measured − 5, rounded down to 5, from a darwin
# profile at the close of the TUI second-cut campaign (17 commits: the hub,
# the phase trail, wide-terminal tiers, and the deploy stream). Every entry
# moved up; none regressed. internal/tui/wizard/deployexec is new this
# campaign and got its first floor the same way.
#
# Regenerate from a LINUX profile. CI runs ubuntu and some packages measure
# differently there than on darwin (okd/provision by 5.5 points last time),
# so a mac-baselined floor tends to fire the stale advisory on its own merge
# commit — that applies to the whole file now, not just a few entries, so
# expect STALE advisories on CI until the next Linux re-baseline.
#
# coverage-check.sh prints a non-fatal STALE line, and a CI warning
# annotation, once an entry drifts past its threshold; that is the signal to
# re-baseline (floors previously went 60 commits without a look).
#
# "*" stays 0, and packages measuring 0% carry no entry: cmd/okdctl,
# internal/version, internal/testutil and scripts/demo legitimately measure
# 0% and must not fail CI. That is a test-coverage backlog, not an
# endorsement — internal/version holds updatecheck.go, which makes a network
# call from a goroutine.
